name: MarketPredict Complete Package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-complete-project.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dataset dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas

      - name: Generate exact deterministic V5 datasets
        run: |
          sudo mkdir -p /mnt/data
          sudo chown -R "$USER":"$USER" /mnt/data
          python ml/generate_saudi_marketing_dataset_v5.py
          ls -lh /mnt/data/saudi_marketing* || true

      - name: Build complete committee/local package
        shell: bash
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE/MarketPredict_COMPLETE"
          mkdir -p "$ROOT/01_PROJECT_SOURCE" "$ROOT/02_DATASET" "$ROOT/03_TRAINING" "$ROOT/04_MODELS" "$ROOT/05_TESTS_AND_VALIDATION" "$ROOT/06_DOCUMENTATION"

          # Full current application source, including UI, API, tests, workflows, configs and frozen runtime models.
          rsync -a --exclude '.git' --exclude 'MarketPredict_COMPLETE' ./ "$ROOT/01_PROJECT_SOURCE/"

          # Dataset generated by the exact deterministic V5 generator used by this project.
          cp -f /mnt/data/saudi_marketing_campaigns_v5.csv "$ROOT/02_DATASET/"
          cp -f /mnt/data/saudi_marketing_campaigns_v5_prelaunch.csv "$ROOT/02_DATASET/"
          cp -f /mnt/data/saudi_marketing_v5_brands.csv "$ROOT/02_DATASET/" || true
          cp -f /mnt/data/saudi_marketing_v5_sealed_split_manifest.json "$ROOT/02_DATASET/" || true
          cp -f /mnt/data/saudi_marketing_v5_generation_summary.json "$ROOT/02_DATASET/" || true

          # Training and generation code.
          cp -f ml/generate_saudi_marketing_dataset_v5.py "$ROOT/03_TRAINING/"
          cp -f ml/train_v5_stage1.py "$ROOT/03_TRAINING/"
          cat > "$ROOT/03_TRAINING/training_requirements.txt" <<'EOF'
          numpy
          pandas
          scikit-learn
          lightgbm
          catboost
          joblib
          openpyxl
          EOF
          sed -i 's/^          //' "$ROOT/03_TRAINING/training_requirements.txt"

          # Frozen deployed model files and metadata.
          cp -a models/. "$ROOT/04_MODELS/"

          # Automated tests, sample payloads and the six-campaign batch validation material.
          cp -a tests/. "$ROOT/05_TESTS_AND_VALIDATION/tests/"
          cp -a sample_payloads/. "$ROOT/05_TESTS_AND_VALIDATION/sample_payloads/"
          cp -a scripts/. "$ROOT/05_TESTS_AND_VALIDATION/scripts/"
          mkdir -p "$ROOT/05_TESTS_AND_VALIDATION/latest_results"
          if [ -f artifacts/campaign_validation_results.csv ]; then cp artifacts/campaign_validation_results.csv "$ROOT/05_TESTS_AND_VALIDATION/latest_results/"; fi
          if [ -f artifacts/campaign_validation_results.json ]; then cp artifacts/campaign_validation_results.json "$ROOT/05_TESTS_AND_VALIDATION/latest_results/"; fi

          # Package guide; README.md in repository remains untouched/empty.
          cat > "$ROOT/06_DOCUMENTATION/PACKAGE_CONTENTS.txt" <<'EOF'
          MarketPredict COMPLETE PACKAGE
          ==============================
          01_PROJECT_SOURCE        Full web project currently on GitHub main.
          02_DATASET               V5 full + leakage-safe prelaunch dataset and split/brand files.
          03_TRAINING              Dataset generator, training script and training dependencies.
          04_MODELS                Frozen deployed V5 model runtime files and model metadata.
          05_TESTS_AND_VALIDATION  Pytest suite, objective samples, six-campaign CSV and validation scripts/results when present.
          06_DOCUMENTATION         This package guide.

          Dataset notes:
          - 72,000 campaigns, 1,100 synthetic brands, 2022-01-01 through 2026-08-10.
          - Saudi-calibrated synthetic V5; public Saudi evidence was used for calibration/range checks, not represented as raw private advertiser exports.
          - saudi_marketing_campaigns_v5_prelaunch.csv is the leakage-safe modeling dataset.
          - Post-launch outcome columns exist only in the full dataset and are excluded from prediction inputs.
          EOF
          sed -i 's/^          //' "$ROOT/06_DOCUMENTATION/PACKAGE_CONTENTS.txt"

          cat > "$ROOT/06_DOCUMENTATION/CURRENT_COMMIT.txt" <<EOF
          Repository: mographiccode-cell/MarketPredict
          Commit: $GITHUB_SHA
          Packaged UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          cd "$GITHUB_WORKSPACE"
          zip -r -9 MarketPredict_COMPLETE.zip MarketPredict_COMPLETE >/dev/null
          sha256sum MarketPredict_COMPLETE.zip > MarketPredict_COMPLETE.zip.sha256
          du -h MarketPredict_COMPLETE.zip

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: MarketPredict-COMPLETE
          path: |
            MarketPredict_COMPLETE.zip
            MarketPredict_COMPLETE.zip.sha256
          retention-days: 30
          compression-level: 0
